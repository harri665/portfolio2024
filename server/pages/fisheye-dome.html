<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equidistant Fisheye Video Dome</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #play-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="play-overlay">Click to Start Video Dome</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = false;
        controls.enablePan = false;

        camera.position.set(0, 0, 0.1);

        const video = document.createElement('video');
        video.src = '/api/proxy/video?url=' + encodeURIComponent('https://cloud.harrison-martin.com/s/Qri4LKZnDiscxkM/download');
        video.loop = true;
        video.muted = true;
        video.playsInline = true;

        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.colorSpace = THREE.SRGBColorSpace;

        const geometry = new THREE.SphereGeometry(500, 64, 64, 0, Math.PI * 2, 0, Math.PI / 2);

        const vertexShader = `
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * viewMatrix * worldPosition;
          }
        `;

        const fragmentShader = `
          uniform sampler2D map;
          varying vec3 vWorldPosition;
          void main() {
            vec3 dir = normalize(vWorldPosition);

            float phi = acos(dir.y);
            float theta = atan(dir.z, dir.x);

            float r = phi / 3.14159265359;
            vec2 uv = vec2(0.5) + vec2(r * cos(theta), r * sin(theta));

            if (length(uv - vec2(0.5)) > 0.5) discard;

            gl_FragColor = texture2D(map, uv);
          }
        `;

        const material = new THREE.ShaderMaterial({
          uniforms: { map: { value: videoTexture } },
          vertexShader: vertexShader,
          fragmentShader: fragmentShader,
          side: THREE.BackSide
        });

        const dome = new THREE.Mesh(geometry, material);
        scene.add(dome);

        const overlay = document.getElementById('play-overlay');
        overlay.addEventListener('click', () => {
            video.play().then(() => {
                overlay.style.display = 'none';
            }).catch(err => {
                console.error("Video play failed. Check CORS or valid stream URL.", err);
                overlay.innerText = "Error: Video failed to load (Check Console for CORS/URL issues)";
            });
        });

        function animate() {
          requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
