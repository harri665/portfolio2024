# crawlers don't run JS, send them to /__og for server rendered og tags
map $http_user_agent $og_crawler {
  default 0;
  "~*(bot|crawler|spider|scraper|preview|embedly|iframely|facebookexternalhit|slack|discord|telegram|whatsapp|skype|mastodon|bluesky|quora|vkshare|flipboard|nuzzel|w3c_validator)" 1;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:3005/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # nextcloud doesn't send CORS headers
  location /api/proxy/ {
    proxy_pass http://server:3005/api/proxy/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_buffering off;
  }

  location /p/ {
    proxy_pass http://server:3005/p/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # generated per host by the backend
  location = /robots.txt {
    proxy_pass http://server:3005/robots.txt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sitemap.xml {
    proxy_pass http://server:3005/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # otherwise / goes straight to index.html and never hits @app, so crawlers get no meta tags
  location = / {
    try_files /nonexistent @app;
  }

  # hashed files never change. missing ones HAVE to 404, falling back to index.html serves
  # html as js (and cloudflare caches it) and the page is blank after a deploy
  location /static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # names the current bundle hashes so never cache it
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Serve the React app and support client-side routing. Real files (JS, CSS,
  # images) always win, so crawlers fetching og:image assets are unaffected.
  location / {
    try_files $uri $uri/ @app;
  }

  location @app {
    if ($og_crawler) {
      rewrite ^ /__og last;
    }
    rewrite ^ /index.html last;
  }

  location = /__og {
    internal;
    proxy_pass http://server:3005/__og;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header User-Agent $http_user_agent;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    error_page 502 504 = @app_fallback;
  }

  location @app_fallback {
    rewrite ^ /index.html last;
  }
}
