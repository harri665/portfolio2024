# Link-unfurling bots and search crawlers don't run JS, so they only ever see
# the static index.html shell. Flag them here and hand them server-rendered
# Open Graph tags instead (see the @app / /__og locations below).
map $http_user_agent $og_crawler {
  default 0;
  "~*(bot|crawler|spider|scraper|preview|embedly|iframely|facebookexternalhit|slack|discord|telegram|whatsapp|skype|mastodon|bluesky|quora|vkshare|flipboard|nuzzel|w3c_validator)" 1;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Route API requests to the backend service on the Docker network.
  location /api/ {
    proxy_pass http://server:3005/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Video proxy — needed because Nextcloud doesn't send CORS headers.
  location /api/proxy/ {
    proxy_pass http://server:3005/api/proxy/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_buffering off;
  }

  # Route custom static pages to the backend.
  location /p/ {
    proxy_pass http://server:3005/p/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # robots.txt and sitemap.xml are generated per host by the backend, so they
  # must not be served from the build directory.
  location = /robots.txt {
    proxy_pass http://server:3005/robots.txt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sitemap.xml {
    proxy_pass http://server:3005/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The bare domain would otherwise resolve straight to index.html via the
  # index directive and never reach @app, leaving crawlers without meta tags.
  location = / {
    try_files /nonexistent @app;
  }

  # Serve the React app and support client-side routing. Real files (JS, CSS,
  # images) always win, so crawlers fetching og:image assets are unaffected.
  location / {
    try_files $uri $uri/ @app;
  }

  # Only reached for client-side routes, i.e. paths with no file behind them.
  location @app {
    if ($og_crawler) {
      rewrite ^ /__og last;
    }
    rewrite ^ /index.html last;
  }

  # Server-rendered preview metadata for the requested route.
  location = /__og {
    internal;
    proxy_pass http://server:3005/__og;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header User-Agent $http_user_agent;
    # Don't leave a bot staring at a spinner if the backend is slow.
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    error_page 502 504 = @app_fallback;
  }

  # If the backend is down, still serve the app shell.
  location @app_fallback {
    rewrite ^ /index.html last;
  }
}
